name: Build Debug APK

# 这个仓库上游没有 CI。加一份只是为了能编译验证改动——
# 本地没有 JDK / Android SDK，编不了。
#
# 编译失败时自动开一个 issue，把 Kotlin 报错行贴进去。
# 原因：Actions 的日志 API 要认证，手机上翻网页日志很痛苦；
# issue 是公开可读的，抓一遍就知道错在哪。

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lyra_x11 的 .gitmodules 里写的是 git@github.com:...
      # CI 里没有 SSH key，checkout 的 submodules: recursive 会直接失败。
      # 这里把它改写成 https，再手动拉。
      - name: Rewrite submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Init submodules
        run: git submodule update --init --recursive

      # gradlew 在 git 里没有 +x 位，CI 直接跑会 Permission denied。
      # 本地已经 chmod 过并提交了，但保险起见这里再设一次——
      # 有些 Windows 用户的 fork 会把模式位弄丢。
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      # 失败时把日志推回仓库的 ci-log 分支。
      #
      # 为什么不用 issue：fork 上 issues: write 不一定生效，实测那一步
      # 自己也失败了，什么都拿不到。推分支用的是 contents: write，
      # 在 fork 上一定可用，而且日志是原文，不会被截断。
      #
      # ci-log 不在 workflow 的 branches 触发列表里，所以它不会
      # 再触发一轮构建。
      - name: Publish build log to ci-log branch
        if: failure()
        run: |
          mkdir -p .ci
          if [ -f build.log ]; then
            cp build.log .ci/build.log
          else
            echo "(build.log 不存在 —— gradle 那一步可能没跑到)" > .ci/build.log
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f .ci/build.log
          git commit -m "ci: build log for ${{ github.sha }}" || true
          git push -f origin ci-log
