name: Build Debug APK

# 这个仓库上游没有 CI。加一份只是为了能编译验证改动——
# 本地没有 JDK / Android SDK，编不了。
#
# 编译失败时自动开一个 issue，把 Kotlin 报错行贴进去。
# 原因：Actions 的日志 API 要认证，手机上翻网页日志很痛苦；
# issue 是公开可读的，抓一遍就知道错在哪。

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lyra_x11 的 .gitmodules 里写的是 git@github.com:...
      # CI 里没有 SSH key，checkout 的 submodules: recursive 会直接失败。
      # 这里把它改写成 https，再手动拉。
      - name: Rewrite submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
            } catch (e) {
              log = '(build.log 不存在，编译可能根本没跑到 gradle 那一步)';
            }
            const lines = log.split('\n');
            const hits = lines.filter(l =>
              /^e: /.test(l) ||
              /^w: .*error/i.test(l) ||
              /error: /.test(l) ||
              /What went wrong/.test(l) ||
              /Execution failed for task/.test(l) ||
              /Caused by:/.test(l)
            );
            const body = (hits.length ? hits.slice(0, 300).join('\n') : log.slice(-9000)) || '(空日志)';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `build failed: ${context.sha.slice(0, 8)}`,
              body: [
                '```',
                body,
                '```',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Branch: \`${context.ref}\``,
              ].join('\n'),
            });
