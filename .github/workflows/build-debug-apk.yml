name: Build Debug APK

# 这个仓库上游没有 CI。加一份只是为了能编译验证改动——
# 本地没有 JDK / Android SDK，编不了。

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lyra_x11 的 .gitmodules 里写的是 git@github.com:...
      # CI 里没有 SSH key，checkout 的 submodules: recursive 会直接失败。
      # 这里把它改写成 https，再手动拉。放在 checkout 之后、
      # submodule 之前，所以不能用 checkout 自带的 submodules 选项。
      - name: Rewrite submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      # 编译失败时把日志也传上来，手机上就能看，
      # 不用去网页里翻那段被截断的日志。
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
